name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "1.24.x", "1.25.x", "1.26.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go mod verify
      - run: go vet ./...
      - run: go mod tidy
      - name: go.mod is tidy
        run: test -z "$(git status --porcelain go.mod go.sum)"
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Report
        run: echo "覆盖率 $(go tool cover -func=coverage.txt | awk '/^total:/ {print $3}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate
        run: |
          module=$(go list -m)
          targets="$module/pkg/ $module/internal/config/ $module/internal/svc/"
          go tool cover -func=coverage.txt |
            awk -v targets="$targets" '
              {
                n = split(targets, paths, " ")
                for (i = 1; i <= n; i++) {
                  if (index($1, paths[i]) == 1 && $NF != "100.0%") {
                    print
                    failed = 1
                  }
                }
              }
              END { exit failed }
            '